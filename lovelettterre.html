<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffe3e3, #ffd1d1);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            text-align: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 90%;
            position: relative;
            transition: all 0.5s ease;
        }

        h1 {
            color: #d63031;
            font-size: 2.2rem;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            height: 60px;
            align-items: center;
            position: relative;
        }

        button {
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        #yesBtn {
            background-color: #2ecc71;
            color: white;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
        }

        #yesBtn:hover {
            transform: scale(1.1);
        }

        #noBtn {
            background-color: #e74c3c;
            color: white;
            position: absolute;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
            user-select: none;
        }

        /* Letter Styling (Hidden by default) */
        .letter-screen {
            display: none;
        }

        .letter-text {
            color: #4a4a4a;
            font-size: 1.1rem;
            line-height: 1.6;
            white-space: pre-line; /* Keeps line breaks */
            background: #fff9f9;
            padding: 20px;
            border-radius: 10px;
            border-left: 5px solid #d63031;
            text-align: left;
            margin-top: 20px;
        }

        .heart {
            font-size: 3rem;
            animation: beat 0.6s infinite alternate;
        }

        @keyframes beat {
            to { transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <div class="container" id="card">
        <!-- Proposal Screen -->
        <div id="proposalScreen">
            <div class="heart">💝</div>
            <!-- EDIT YOUR QUESTION HERE -->
            <h1 id="questionText">Will you be my Valentine?</h1>
            
            <div class="buttons">
                <button id="yesBtn" onclick="showLetter()">Yes!</button>
                <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No</button>
            </div>
        </div>

        <!-- Success Letter Screen -->
        <div id="letterScreen" class="letter-screen">
            <div class="heart">💖</div>
            <h1 style="color: #2ecc71;">YAY! 🥰</h1>
            <!-- EDIT YOUR LETTER MESSAGE HERE -->
            <div class="letter-text" id="letterContent">Dear [Name],

I am so incredibly happy you said yes! You make every single day brighter, and I cannot wait to celebrate with you. 

Love always,
[Your Name]</div>
        </div>
    </div>

    <script>
        // Customization variables
        // You can change these texts directly right here in the code:
        const customQuestion = "Will you be my Valentine?";
        const customLetter = "Dear [Name],\n\nI am so incredibly happy you said yes! You make every single day brighter, and I cannot wait to celebrate with you.\n\nLove always,\n[Your Name]";

        // Apply customization to the page
        document.getElementById('questionText').innerText = customQuestion;
        document.getElementById('letterContent').innerText = customLetter;

        // Function to make the NO button run away
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const card = document.getElementById('card');
            
            // Get dimensions of the card container boundaries
            const padding = 20;
            const maxX = card.clientWidth - noBtn.clientWidth - (padding * 2);
            const maxY = card.clientHeight - noBtn.clientHeight - (padding * 2);
            
            // Calculate random positions within the card
            const randomX = Math.floor(Math.random() * maxX) + padding;
            const randomY = Math.floor(Math.random() * maxY) + padding;
            
            // Apply new coordinates relative to the card container
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        // Function to transition to the letter
        function showLetter() {
            document.getElementById('proposalScreen').style.display = 'none';
            document.getElementById('letterScreen').style.display = 'block';
        }
    </script>
</body>
</html>
